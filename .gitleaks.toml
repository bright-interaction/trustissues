# gitleaks config for Trustissues (used by the public-mirror publish gate and any
# local scan). Extends the default ruleset, then allowlists PLACEHOLDERS and TEST
# FIXTURES.
#
# The fixtures matter more here than in the other mirrors. Trustissues ships
# Shield, a PII/secret redactor, and the only way to test a redactor is to feed it
# things that look exactly like real secrets: sk_live_ keys, IBANs, personnummer,
# API tokens. internal/shield/testdata/pii.corpus exists to hold those, and every
# one of them is synthetic. Without this allowlist the publish gate would refuse
# forever over the test data that proves the product works.
#
# A genuine leaked credential would not sit under testdata/ and would not carry a
# change-me marker, so both are still caught.
title = "trustissues"

[extend]
useDefault = true

[allowlist]
description = "Config placeholders and Shield's synthetic PII/secret corpus"
paths = [
  '''internal/shield/testdata/.*''',
  '''internal/shield/.*_test\.go''',
  '''internal/handlers/.*_test\.go''',
  # A sequential hex placeholder that exists only to make the rest of the config
  # valid so one field is under test, and a key whose value literally reads
  # "test-vault-key-with-enough-entropy". Both verified to appear in zero
  # non-test files.
  '''internal/config/.*_test\.go''',
  '''internal/columncrypto/.*_test\.go''',
  # The gate's own source. mirror-secret-allowlist.txt documents each synthetic
  # fixture BY VALUE with the reason it is safe, so the file necessarily contains
  # credential-shaped strings and gitleaks flags its Stripe-shaped example. This
  # is the self-trip CLAUDE.md section 15 names: a gate refusing its own source
  # because the file carrying the marker ships inside the tree it scans.
  '''scripts/mirror-secret-allowlist\.txt''',
]
regexes = [
  # The reflectguard false-positive fixture, as it existed in commit f165f9248
  # ONLY. Two minutes later f80d7b07d replaced it with the low-entropy
  # `sk-live/AbCdEf/1234/XyZ`, which is the fix the 2026-08-15 decision called
  # for, but this gate scans HISTORY and that commit still carries the original.
  # The two hits are the same 16-hex fixture differing in the last character:
  # dialects_test.go:137 defines it and :144 embeds a deliberate "one character
  # off" near-miss, both feeding TestDecodedReadingsDoNotFireOnCleanTraffic,
  # whose whole job is proving the scanner does NOT fire on clean traffic.
  # Verified to appear in exactly two monorepo commits and zero working trees.
  #
  # Allowlisted BY VALUE and never by path. Adding
  # `internal/reflectguard/.*_test\.go` to the paths list also clears these two,
  # and an ablation showed it then reports "no leaks found" over a real secret
  # planted in that package: a path entry makes this gate structurally unable to
  # fail over a credential vault's own guard code. Same reasoning as the
  # correct-horse-battery-staple entry below.
  '''sk-live-9f3a2b7c8d1e4f5[ab]''',
  '''changeme''',
  '''change[_-]?me''',
  '''your_[a-z0-9_]*''',
  '''YOUR_[A-Z0-9_]*''',
  '''example\.com''',
  '''example\.se''',
  '''EXAMPLE''',
  # Documented, deliberately-invalid sample values in .env.example and the docs.
  '''openssl rand -hex 32''',
  # RFC 6238 appendix B TOTP test vector, base32 of "12345678901234567890"
  # (internal/totp/totp_test.go). It is printed in the RFC, so it is about as
  # public as a string can be, and the TOTP implementation cannot be verified
  # against the standard without it.
  '''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''',
  # xkcd 936's passphrase, used as the login password in
  # scripts/live-crossversion-skeptic.sh so the script reads as obviously
  # synthetic. Allowlisted BY VALUE rather than by adding the script to `paths`:
  # that file drives a live instance, so it is exactly the wrong place to stop
  # scanning for real credentials.
  '''correct-horse-battery-staple''',
]
