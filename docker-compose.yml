services:
  trustissues:
    build:
      context: .
      args:
        - SERVER_VERSION
    container_name: trustissues
    restart: unless-stopped
    # Longer than the server's 20s delivery drain (see WaitForDelivery), so a
    # restart during a rotation lets the new value reach its targets instead of
    # being SIGKILLed halfway. Docker's default is 10s, which is shorter than the
    # drain and would defeat it.
    stop_grace_period: 45s
    ports:
      # Publish to host loopback ONLY. This app speaks plaintext HTTP; TLS must
      # terminate in a reverse proxy (Caddy) in front of it. Never publish this
      # port on 0.0.0.0: that would expose credentials over unencrypted HTTP.
      # Prefer having Caddy reach the container over the internal Docker network
      # instead of via this published port.
      - "127.0.0.1:8080:8080"
    volumes:
      - trustissues_data:/app/data
    environment:
      # Required secrets: the server refuses to start without them, and rejects
      # the .env.example placeholder values. Generate with: openssl rand -hex 32
      - TRUSTISSUES_JWT_SECRET=${TRUSTISSUES_JWT_SECRET}
      - TRUSTISSUES_VAULT_KEY=${TRUSTISSUES_VAULT_KEY}
      # Master-key rotation. Both are empty in the steady state and are set only
      # while a rotation is in flight. They are listed here for the same reason
      # Shield and ALLOW_KEY_MISMATCH are: a variable absent from this list
      # cannot be set from .env at all, so the documented procedure would silently
      # do nothing, and the operator would discover that mid-rotation.
      #
      # _PREVIOUS is the OLD key: with it set, decryption falls back to it, so an
      # unswept store keeps serving instead of blanking every secret.
      # _REKEY_ON_BOOT=1 runs the re-encrypt sweep before the server accepts
      # traffic, for deploys where nobody logs in to press the button in
      # Settings -> Encryption. Remove BOTH once the sweep reports everything on
      # the current key, otherwise the retired key stays loaded and keeps
      # opening this data.
      - TRUSTISSUES_VAULT_KEY_PREVIOUS=${TRUSTISSUES_VAULT_KEY_PREVIOUS:-}
      - TRUSTISSUES_VAULT_KEY_REKEY_ON_BOOT=${TRUSTISSUES_VAULT_KEY_REKEY_ON_BOOT:-}
      - TRUSTISSUES_BASE_URL=${TRUSTISSUES_BASE_URL:-http://localhost:8080}
      - TRUSTISSUES_TRUSTED_PROXY_HOPS=${TRUSTISSUES_TRUSTED_PROXY_HOPS:-1}
      # Only these direct socket peers may supply X-Forwarded-* headers. Do
      # not use an entire shared Docker bridge. Loopback is the fail-closed
      # default; when host Caddy uses the published port, override this with
      # this container network's exact bridge-gateway /32. If Caddy shares the
      # network, use Caddy's exact container /32 instead. The `-` (not `:-`)
      # preserves an explicitly empty value, which means trust no proxy peers.
      - TRUSTISSUES_TRUSTED_PROXY_PEERS=${TRUSTISSUES_TRUSTED_PROXY_PEERS-127.0.0.1/32,::1/128}
      # Optional overlay/private listener. Both empty keeps the feature off.
      # In an override, mount a dedicated socket-only directory at
      # /run/trustissues into both this service and the connector. Never mount
      # trustissues_data into a VPN connector. Headscale can use a same-user TLS
      # reverse proxy. See docs/PRIVATE-INGRESS.md before enabling enforcement.
      - TRUSTISSUES_PRIVATE_SOCKET_PATH=${TRUSTISSUES_PRIVATE_SOCKET_PATH:-}
      - TRUSTISSUES_PRIVATE_BASE_URL=${TRUSTISSUES_PRIVATE_BASE_URL:-}
      - TRUSTISSUES_LOG_LEVEL=${TRUSTISSUES_LOG_LEVEL:-info}
      # Error reporting + liveness beacon to the house Flare instance. Absent
      # until 2026-07-31, so trustissues had a provisioned Flare project that
      # could never receive anything: the app read FLARE_DSN, compose never
      # passed it. Empty means off, which is the prior behaviour.
      - FLARE_DSN=${FLARE_DSN:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Shield (LLM-boundary PII tokenization for the AI gateway). Optional, but
      # it was UNREACHABLE via the documented Compose path: these were absent
      # here, so setting them in .env did nothing and Shield stayed off with no
      # warning. A feature that cannot be turned on the way the README says to
      # turn it on is not shipped. Empty means off, which is the prior default.
      - TRUSTISSUES_SHIELD_KEY=${TRUSTISSUES_SHIELD_KEY:-}
      - TRUSTISSUES_SHIELD_HINT_LEVEL=${TRUSTISSUES_SHIELD_HINT_LEVEL:-full}
      # The documented escape hatch, which was UNREACHABLE here for the same
      # reason Shield was: SECURITY.md and the server's own refusal message tell
      # the operator to set it, but it was absent from this list, so setting it
      # in .env did nothing. Combined with `restart: unless-stopped` above, a
      # vault-key mismatch became a crash loop with no documented way out, at
      # the worst possible moment (the first boot after a restore).
      #
      # Empty means off, which is the safe default. Setting it to 1 lets the
      # server start on a key that does not open existing data, and that data
      # then reads as blank and is overwritten by the first edit. It is a
      # last-resort tool, so it stays opt-in and loud.
      - TRUSTISSUES_ALLOW_KEY_MISMATCH=${TRUSTISSUES_ALLOW_KEY_MISMATCH:-}

volumes:
  trustissues_data:
